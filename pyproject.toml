[project]
name = "prenoms-powerbi"
version = "0.1.0"
description = "Pipeline Python / SQL (DuckDB) et rapport Power BI sur les prénoms français, 1900-2025"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
 
[tool.ruff]
target-version = "py312"
line-length = 88
 
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

